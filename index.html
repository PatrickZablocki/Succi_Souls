<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Souls Boss Tracker</title>

  
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="wrap">

    <div class="topbar">
      <div>
        <h1>Souls Boss Tracker</h1>
        <div class="subtitle">
          Elden Ring + Dark Souls Progress Tracker für den Stream 💜
        </div>
      </div>

      <div class="button-row">

        <button id="collapseAll" class="secondary">Alle schließen</button>
        <button id="resetAll">Reset Run</button>
      </div>
    </div>

    
    <div class="grid" id="app"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
